<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Анекдот с сюрпризом</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            background: radial-gradient(circle at 20% 30%, #ff6b6b, #4a00e0);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            margin: 0;
            touch-action: manipulation;
        }
        /* карточка — яркая, с неоновой подсветкой */
        .card {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 48px;
            padding: 30px 20px 34px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), 0 0 0 2px rgba(255, 215, 0, 0.25), 0 0 40px rgba(255, 200, 0, 0.3);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: 0.3s;
            position: relative;
        }

        /* Вопрос — яркий, с радужным градиентом */
        .question {
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(135deg, #feda75, #fa709a, #fee140, #f6d365);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: none;
            margin: 10px 0 28px;
            padding: 18px 12px;
            border-radius: 60px;
            background-color: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            line-height: 1.4;
            letter-spacing: 0.5px;
            -webkit-text-stroke: 0.5px rgba(0,0,0,0.1);
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            margin-top: 4px;
            position: relative;
            min-height: 90px;
        }

        .btn {
            border: none;
            color: white;
            font-size: 2rem;
            font-weight: 800;
            padding: 18px 36px;
            border-radius: 80px;
            cursor: pointer;
            letter-spacing: 0.5px;
            min-width: 130px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.12s ease;
            touch-action: manipulation;
            position: relative;
            transform: translateY(0);
            -webkit-touch-callout: none;
            text-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .btn:active {
            transform: scale(0.93) translateY(4px);
        }

        /* Кнопка ДА — ярко-зелёная, с неоном */
        #yesBtn {
            background: linear-gradient(145deg, #00c851, #00e676);
            box-shadow: 0 8px 0 #007e3a, 0 8px 30px rgba(0, 230, 118, 0.5);
            border-color: #a5d6a7;
        }
        #yesBtn:active {
            box-shadow: 0 3px 0 #007e3a, 0 8px 30px rgba(0, 230, 118, 0.4);
        }

        /* Кнопка НЕТ — ярко-красная, с неоном */
        #noBtn {
            background: linear-gradient(145deg, #ff1744, #ff5252);
            box-shadow: 0 8px 0 #b71c1c, 0 8px 30px rgba(255, 23, 68, 0.5);
            border-color: #ff8a80;
            transition: left 0.25s cubic-bezier(0.34, 1.6, 0.64, 1), top 0.25s cubic-bezier(0.34, 1.6, 0.64, 1), transform 0.1s, box-shadow 0.1s;
            position: relative;
            will-change: left, top;
            touch-action: manipulation;
        }
        #noBtn:active {
            box-shadow: 0 3px 0 #b71c1c, 0 8px 30px rgba(255, 23, 68, 0.4);
        }

        /* область анекдота */
        .joke-area {
            margin-top: 30px;
            padding: 8px 4px;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .joke-text {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 26px 20px;
            border-radius: 32px;
            font-size: 1.6rem;
            color: #fff9e6;
            border-left: 8px solid #ffd54f;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 215, 0, 0.15);
            width: 100%;
            transition: opacity 0.5s cubic-bezier(0.34, 1.4, 0.64, 1), transform 0.5s cubic-bezier(0.34, 1.4, 0.64, 1);
            border: 1px solid rgba(255, 215, 0, 0.2);
            line-height: 1.5;
            font-weight: 500;
            letter-spacing: 0.3px;
            opacity: 0;
            transform: scale(0.8) translateY(20px);
            pointer-events: none;
            word-break: break-word;
            background-image: radial-gradient(circle at 10% 20%, rgba(255,215,0,0.08) 0%, transparent 60%);
        }

        .joke-text.show {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        /* конфетти — ещё ярче */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }

        .confetti-piece {
            position: absolute;
            width: 18px;
            height: 18px;
            opacity: 1;
            border-radius: 4px;
            animation: confettiFall 2.8s ease-out forwards;
            will-change: transform, opacity;
            box-shadow: 0 0 12px rgba(255,255,255,0.3);
        }

        @keyframes confettiFall {
            0% {
                opacity: 1;
                transform: translate(0, 0) rotate(0deg) scale(1.2);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) rotate(900deg) scale(0.1);
            }
        }

        /* аудио скрыто */
        #clownAudio {
            display: none;
        }

        /* мобильные уточнения */
        @media (max-width: 480px) {
            .card {
                padding: 22px 14px 26px;
                border-radius: 36px;
            }
            .question {
                font-size: 1.6rem;
                padding: 14px 10px;
                margin: 8px 0 22px;
            }
            .btn {
                font-size: 1.8rem;
                padding: 16px 22px;
                min-width: 110px;
            }
            .btn-group {
                gap: 16px;
                min-height: 80px;
            }
            .joke-text {
                font-size: 1.3rem;
                padding: 20px 14px;
                border-left-width: 6px;
            }
        }

        @media (max-width: 380px) {
            .btn {
                font-size: 1.5rem;
                padding: 14px 14px;
                min-width: 90px;
            }
            .question {
                font-size: 1.3rem;
            }
            .joke-text {
                font-size: 1.1rem;
                padding: 16px 12px;
            }
        }

        @media (max-height: 700px) {
            .card {
                padding: 16px 12px 20px;
            }
            .question {
                margin: 6px 0 14px;
                padding: 10px 8px;
                font-size: 1.4rem;
            }
            .joke-area {
                margin-top: 16px;
                min-height: 100px;
            }
        }

        /* дополнительные яркие акценты */
        .card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50px;
            background: linear-gradient(45deg, #f093fb, #f5576c, #4facfe, #43e97b, #f093fb);
            background-size: 400% 400%;
            z-index: -1;
            animation: borderGlow 8s ease infinite;
            filter: blur(4px);
            opacity: 0.6;
        }
        @keyframes borderGlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body>
    <div class="card" id="mainCard">
        <!-- Заголовок полностью убран -->

        <div class="question" id="questionText">❓ Хотите анекдот?</div>

        <div class="btn-group" id="btnGroup">
            <button class="btn" id="yesBtn">✅ Да</button>
            <button class="btn" id="noBtn">❌ Нет</button>
        </div>

        <div class="joke-area">
            <div class="joke-text" id="jokeDisplay">
                🎪 Выходит Штирлиц из леса…<br>
                <span style="font-size: 0.9rem; opacity: 0.7;">(анекдот загружен)</span>
            </div>
        </div>
    </div>

    <!-- аудио (звук клоунады) -->
    <audio id="clownAudio" preload="auto">
        <source src="https://www.soundjay.com/misc/sounds/circus-whistle-02.mp3" type="audio/mpeg">
    </audio>

    <div class="confetti-container" id="confettiContainer"></div>

    <script>
        (function() {
            // ---- элементы ----
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            const jokeDisplay = document.getElementById('jokeDisplay');
            const questionText = document.getElementById('questionText');
            const btnGroup = document.getElementById('btnGroup');
            const confettiContainer = document.getElementById('confettiContainer');
            const clownAudio = document.getElementById('clownAudio');
            const mainCard = document.getElementById('mainCard');

            // ---- анекдоты (ещё смешнее) ----
            const jokes = [
                '— Штирлиц, вы что, пьёте?<br>— Нет, это я так, принюхиваюсь…<br>🍺',
                'Встречаются два клоуна:<br>— Ты чего такой грустный?<br>— Да вот, смех забыл дома… 🤡',
                '— Почему у клоуна красный нос?<br>— Чтобы не видно было, что он пьёт! 🍷',
                'Идёт медведь по цирку, видит — клоун плачет.<br>— Ты чего?<br>— Анекдот рассказали, а я не понял… 🐻',
                '— Доктор, я смеюсь без причины!<br>— Это же заразно! Дайте я тоже посмеюсь! 😂',
                'Клоун в баре:<br>— Мне, пожалуйста, что-нибудь весёлое.<br>Бармен: — Анекдот про Штирлица. 🥃',
                '— Что сказал слон, когда наступил на клоуна?<br>— Извините, я не хотел… но было смешно! 🐘',
                '— Как отличить клоуна от политика?<br>— Клоун хотя бы смешит! 🎭'
            ];

            let jokeShown = false;
            let isConfettiActive = false;

            // ---- звук ----
            function playClownSound() {
                try {
                    clownAudio.currentTime = 0;
                    const promise = clownAudio.play();
                    if (promise !== undefined) {
                        promise.catch(() => {});
                    }
                } catch (_) {}
            }

            // ---- конфетти (супер яркое) ----
            function fireConfetti() {
                if (isConfettiActive) return;
                isConfettiActive = true;

                const container = confettiContainer;
                const colors = [
                    '#ff0a54', '#ff477e', '#ff7096', '#ff85a1', '#fbb1bd',
                    '#f9c74f', '#f9844a', '#f8961e', '#f9d74f', '#90be6d',
                    '#43aa8b', '#4d908e', '#577590', '#277da1', '#7209b7',
                    '#b5179e', '#f72585', '#3a0ca3', '#4361ee', '#4cc9f0'
                ];
                const count = 90;

                for (let i = 0; i < count; i++) {
                    const piece = document.createElement('div');
                    piece.className = 'confetti-piece';
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    piece.style.backgroundColor = color;

                    const startX = window.innerWidth / 2 + (Math.random() - 0.5) * 160;
                    const startY = window.innerHeight / 2 + (Math.random() - 0.5) * 120;
                    piece.style.left = startX + 'px';
                    piece.style.top = startY + 'px';

                    const size = 10 + Math.random() * 18;
                    piece.style.width = size + 'px';
                    piece.style.height = size + 'px';
                    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';

                    const angle = Math.random() * 2 * Math.PI;
                    const distance = 200 + Math.random() * 750;
                    const tx = Math.cos(angle) * distance;
                    const ty = Math.sin(angle) * distance - 200;

                    piece.style.setProperty('--tx', tx + 'px');
                    piece.style.setProperty('--ty', ty + 'px');

                    const duration = 2.2 + Math.random() * 1.6;
                    piece.style.animationDuration = duration + 's';
                    piece.style.animationDelay = (Math.random() * 0.5) + 's';

                    // добавим вращение
                    container.appendChild(piece);

                    setTimeout(() => {
                        if (piece.parentNode) piece.remove();
                    }, (duration + 1) * 1000);
                }

                setTimeout(() => {
                    isConfettiActive = false;
                }, 3800);
            }

            // ---- показать анекдот ----
            function showJoke() {
                if (jokeShown) return;
                jokeShown = true;

                const randomIndex = Math.floor(Math.random() * jokes.length);
                jokeDisplay.innerHTML = jokes[randomIndex];
                jokeDisplay.classList.add('show');

                questionText.style.display = 'none';
                btnGroup.style.display = 'none';

                playClownSound();
                fireConfetti();

                // второй залп через 0.6 сек
                setTimeout(() => {
                    if (!isConfettiActive) fireConfetti();
                }, 600);
            }

            // ---- ДВИЖЕНИЕ КНОПКИ "НЕТ" (для телефона и мыши) ----
            function moveNoButton() {
                if (jokeShown) return;

                const cardRect = mainCard.getBoundingClientRect();
                const btnWidth = noBtn.offsetWidth;
                const btnHeight = noBtn.offsetHeight;

                const padding = 16;
                const areaWidth = cardRect.width - padding * 2 - btnWidth;
                const areaHeight = cardRect.height - padding * 2 - btnHeight;

                if (areaWidth <= 0 || areaHeight <= 0) return;

                const currentLeft = noBtn.offsetLeft;
                const currentTop = noBtn.offsetTop;

                let newLeft, newTop;
                let attempts = 0;
                const maxAttempts = 40;

                do {
                    newLeft = Math.random() * areaWidth + padding;
                    newTop = Math.random() * areaHeight + padding;
                    attempts++;
                } while (
                    (Math.abs(newLeft - currentLeft) < 50 && Math.abs(newTop - currentTop) < 50) &&
                    attempts < maxAttempts
                );

                noBtn.style.left = newLeft + 'px';
                noBtn.style.top = newTop + 'px';
            }

            // ---- события для "Нет" ----
            noBtn.addEventListener('mouseenter', function(e) {
                if (jokeShown) return;
                moveNoButton();
            });

            noBtn.addEventListener('touchstart', function(e) {
                if (jokeShown) return;
                e.preventDefault();
                moveNoButton();
            }, { passive: false });

            noBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                if (!jokeShown) {
                    moveNoButton();
                }
            });

            // ---- "Да" ----
            yesBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                showJoke();
            });

            yesBtn.addEventListener('touchend', function(e) {
                e.preventDefault();
                showJoke();
            }, { passive: false });

            // ---- сброс позиции при ресайзе / повороте ----
            window.addEventListener('resize', function() {
                if (!jokeShown) {
                    noBtn.style.left = 'auto';
                    noBtn.style.top = 'auto';
                }
            });

            window.addEventListener('orientationchange', function() {
                setTimeout(() => {
                    if (!jokeShown) {
                        noBtn.style.left = 'auto';
                        noBtn.style.top = 'auto';
                    }
                }, 300);
            });

            console.log('🎉 Яркая версия без заголовка! Жми "Да"!');
        })();
    </script>
</body>
</html>
