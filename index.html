<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Анекдот</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            background: linear-gradient(145deg, #d4e9ff, #b8d8f8, #a3cff0);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            margin: 0;
            touch-action: manipulation;
        }
        .card {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 40px;
            padding: 32px 20px 36px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12), 0 0 0 1px rgba(255, 255, 255, 0.3);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: 0.2s;
            position: relative;
        }

        .question {
            font-size: 2.6rem;
            font-weight: 900;
            color: #1a3a5a;
            margin: 4px 0 28px;
            padding: 22px 12px;
            border-radius: 60px;
            background: rgba(255, 215, 0, 0.1);
            border: 2px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.04);
            line-height: 1.3;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 8px rgba(255, 215, 0, 0.05);
        }
        .question span {
            display: inline-block;
            background: linear-gradient(135deg, #f7971e, #ffd200, #f7971e);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
            animation: shimmer 3s ease-in-out infinite;
        }
        @keyframes shimmer {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-top: 6px;
            position: relative;
            min-height: 90px;
        }

        .btn {
            border: none;
            color: white;
            font-size: 2rem;
            font-weight: 700;
            padding: 18px 38px;
            border-radius: 80px;
            cursor: pointer;
            letter-spacing: 0.3px;
            min-width: 130px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.1s ease;
            touch-action: manipulation;
            position: relative;
            transform: translateY(0);
            -webkit-touch-callout: none;
            text-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .btn:active {
            transform: scale(0.94) translateY(3px);
        }

        #yesBtn {
            background: linear-gradient(145deg, #2d8f4e, #3ab85e);
            box-shadow: 0 6px 0 #1a6a34, 0 6px 30px rgba(58, 184, 94, 0.25);
        }
        #yesBtn:active {
            box-shadow: 0 2px 0 #1a6a34, 0 6px 30px rgba(58, 184, 94, 0.15);
        }

        #noBtn {
            background: linear-gradient(145deg, #b71c1c, #d32f2f);
            box-shadow: 0 6px 0 #7f0000, 0 6px 30px rgba(211, 47, 47, 0.25);
            transition: left 0.25s cubic-bezier(0.34, 1.6, 0.64, 1), top 0.25s cubic-bezier(0.34, 1.6, 0.64, 1), transform 0.1s, box-shadow 0.1s;
            position: relative;
            will-change: left, top;
            touch-action: manipulation;
        }
        #noBtn:active {
            box-shadow: 0 2px 0 #7f0000, 0 6px 30px rgba(211, 47, 47, 0.15);
        }

        #moreBtn {
            background: linear-gradient(145deg, #6a1b9a, #8e24aa);
            box-shadow: 0 6px 0 #4a148c, 0 6px 30px rgba(142, 36, 170, 0.25);
            font-size: 1.6rem;
            padding: 14px 28px;
            min-width: 200px;
            display: none;
            margin-top: 8px;
        }
        #moreBtn:active {
            box-shadow: 0 2px 0 #4a148c, 0 6px 30px rgba(142, 36, 170, 0.15);
        }

        .joke-area {
            margin-top: 28px;
            padding: 8px 4px;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .joke-text {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 26px 18px;
            border-radius: 28px;
            font-size: 1.5rem;
            color: #1a2a3a;
            border-left: 6px solid #ffb300;
            box-shadow: 0 8px 36px rgba(0, 0, 0, 0.08);
            width: 100%;
            transition: opacity 0.45s cubic-bezier(0.34, 1.2, 0.64, 1), transform 0.45s cubic-bezier(0.34, 1.2, 0.64, 1);
            border: 1px solid rgba(255, 180, 0, 0.15);
            line-height: 1.6;
            font-weight: 500;
            letter-spacing: 0.2px;
            opacity: 0;
            transform: scale(0.85) translateY(18px);
            pointer-events: none;
            word-break: break-word;
            text-align: left;
        }
        .joke-text.show {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        /* Аккуратный опрос */
        .survey-overlay {
            display: none;
            margin-top: 20px;
            padding: 20px 16px 24px;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
            animation: fadeInUp 0.5s cubic-bezier(0.34, 1.2, 0.64, 1);
        }
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(20px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .survey-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1a3a5a;
            margin-bottom: 16px;
        }
        .survey-title .emoji {
            font-size: 2rem;
        }
        .survey-btns {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .survey-btns .btn {
            font-size: 1.5rem;
            padding: 14px 32px;
            min-width: 110px;
        }
        #surveyYes {
            background: linear-gradient(145deg, #2d8f4e, #3ab85e);
            box-shadow: 0 6px 0 #1a6a34, 0 6px 30px rgba(58, 184, 94, 0.2);
        }
        #surveyNo {
            background: linear-gradient(145deg, #b71c1c, #d32f2f);
            box-shadow: 0 6px 0 #7f0000, 0 6px 30px rgba(211, 47, 47, 0.2);
        }
        .survey-result {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1a3a5a;
            padding: 12px;
            display: none;
            animation: fadeInUp 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
        }
        .survey-result .highlight {
            color: #d32f2f;
        }
        .survey-result .happy {
            color: #2d8f4e;
        }

        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }

        .confetti-piece {
            position: absolute;
            width: 13px;
            height: 13px;
            opacity: 0.9;
            border-radius: 3px;
            animation: confettiFall 2.5s ease-out forwards;
            will-change: transform, opacity;
        }

        @keyframes confettiFall {
            0% {
                opacity: 1;
                transform: translate(0, 0) rotate(0deg) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) rotate(660deg) scale(0.1);
            }
        }

        #clownAudio {
            display: none;
        }

        @media (max-width: 480px) {
            .card {
                padding: 22px 14px 26px;
                border-radius: 32px;
            }
            .question {
                font-size: 2rem;
                padding: 16px 10px;
                margin: 0 0 20px;
            }
            .btn {
                font-size: 1.7rem;
                padding: 16px 24px;
                min-width: 100px;
            }
            .btn-group {
                gap: 18px;
                min-height: 80px;
            }
            .joke-text {
                font-size: 1.2rem;
                padding: 18px 14px;
            }
            #moreBtn {
                font-size: 1.3rem;
                padding: 12px 20px;
                min-width: 160px;
            }
            .survey-title {
                font-size: 1.5rem;
            }
            .survey-btns .btn {
                font-size: 1.3rem;
                padding: 12px 24px;
                min-width: 90px;
            }
        }

        @media (max-width: 380px) {
            .btn {
                font-size: 1.4rem;
                padding: 14px 16px;
                min-width: 80px;
            }
            .question {
                font-size: 1.6rem;
            }
            .joke-text {
                font-size: 1rem;
                padding: 14px 12px;
            }
            #moreBtn {
                font-size: 1.1rem;
                padding: 10px 16px;
                min-width: 140px;
            }
        }

        @media (max-height: 700px) {
            .card {
                padding: 16px 12px 18px;
            }
            .question {
                margin: 0 0 12px;
                padding: 12px 8px;
                font-size: 1.7rem;
            }
            .joke-area {
                margin-top: 14px;
                min-height: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="card" id="mainCard">

        <div class="question" id="questionText">
            <span>❓ Хочешь анекдот?</span>
        </div>

        <div class="btn-group" id="btnGroup">
            <button class="btn" id="yesBtn">✅ Да</button>
            <button class="btn" id="noBtn">❌ Нет</button>
        </div>

        <div class="joke-area">
            <div class="joke-text" id="jokeDisplay">
                🎪 Йо, ща будет угар…
            </div>
            <button class="btn" id="moreBtn">🔥 Ещё шутеечку?</button>

            <!-- аккуратный опрос -->
            <div class="survey-overlay" id="surveyOverlay">
                <div class="survey-title">
                    <span class="emoji">😏</span> Ну как тебе?
                </div>
                <div class="survey-btns" id="surveyBtns">
                    <button class="btn" id="surveyYes">😊 Зачёт!</button>
                    <button class="btn" id="surveyNo">😤 Не очень</button>
                </div>
                <div class="survey-result" id="surveyResult"></div>
            </div>
        </div>
    </div>

    <audio id="clownAudio" preload="auto">
        <source src="https://www.soundjay.com/misc/sounds/circus-whistle-02.mp3" type="audio/mpeg">
    </audio>

    <div class="confetti-container" id="confettiContainer"></div>

    <script>
        (function() {
            // ---- элементы ----
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            const moreBtn = document.getElementById('moreBtn');
            const jokeDisplay = document.getElementById('jokeDisplay');
            const questionText = document.getElementById('questionText');
            const btnGroup = document.getElementById('btnGroup');
            const surveyOverlay = document.getElementById('surveyOverlay');
            const surveyBtns = document.getElementById('surveyBtns');
            const surveyResult = document.getElementById('surveyResult');
            const surveyYes = document.getElementById('surveyYes');
            const surveyNo = document.getElementById('surveyNo');
            const confettiContainer = document.getElementById('confettiContainer');
            const mainCard = document.getElementById('mainCard');
            const clownAudio = document.getElementById('clownAudio');

            // ---- ШУТКИ ----
            const jokes = [
                `Решил стать слесарем. Думал, буду чинить краны, а оказалось, что всю жизнь мне будут говорить: «Саня, блять, дай ключ на 14».`,

                `Психотерапевт говорит: «Вам нужно принять свою темную сторону». Я принял. Теперь моя темная сторона требует, чтобы я послал терапевта нахуй, и я чувствую себя просто прекрасно.`,

                `Вчера было так плохо, что я пил водку с пивом, чтобы хоть как-то разбавить это дерьмо. Сегодня я понял, что разбавлял я говно в своем стакане.`,

                `Раньше я думал, что в старости буду мудрым дедом с внуками. Сейчас я понимаю, что буду просто старым пердуном, который орет на молодежь из окна, потому что у меня кончился интернет, а я не помню пароль от вайфая.`,

                `На собеседовании спросили: «Какие у вас недостатки?». Ответил: «Я слишком честный». Босс сказал: «Я не считаю это недостатком». Тогда я сказал: «Да мне вообще похуй на вашу работу, я просто хочу деньги».`,

                `Решил заняться спортом и правильным питанием. Сказал себе: «Хватит жрать эту херню!». В ответ услышал внутренний голос: «А кто тебе сказал, что пицца — это херня? Пицца — это культура, мудила».`,

                `Жизнь — это как унитаз. То ты на нем сидишь, то он тебя смывает. И только коту на это насрать (в прямом смысле).`,

                `Лег спать в 11 вечера с мыслью, что высплюсь. Проснулся в 3 часа ночи от того, что захотелось пить. Посмотрел в телефон, залип на 5 минут, понял, что уже утро, и решил: «А пошло оно всё, буду страдать».`,

                `Есть два типа людей: те, кто может экстраполировать данные из неполной информации. И еб*ки, которые не поняли эту шутку.`,

                `Родители говорили мне: «Будь вежливым, не матерись». Я вырос, купил машину, и теперь мой лексикон — это сборник лучших пожеланий здоровья всем водителям. И я считаю это проявлением высокой культуры общения.`,

                `Деньги — это зло. Но я люблю это зло так сильно, что готов просыпаться каждое утро в 6 утра, чтобы обниматься с этим злом в офисном кресле.`,

                `Вчера пытался починить роутер. Метод «выключи-включи» не помог. Помог метод «пни его ногой и скажи: "Да работай ты, сука!"». Технологии шагнули вперед.`,

                `С утра посмотрел в зеркало и подумал: «Ну, красавчик, выходи». Зеркало треснуло. Видимо, не выдержало моего чувства юмора.`,

                `Живите так, чтобы ваши друзья, когда вас не стало, сказали не «Какой был хороший человек», а «Блять, а кто теперь будет нам присылать эти идиотские мемы в 3 часа ночи?». Вот это настоящее наследие.`
            ];

            // ---- состояние ----
            let jokeShown = false;
            let isConfettiActive = false;
            let jokeCounter = 0;
            let usedIndices = [];
            let surveyShown = false;      // опрос показан только 1 раз

            // ---- ЗВУК (исправлен) ----
            function playClownSound() {
                try {
                    clownAudio.currentTime = 0;
                    const promise = clownAudio.play();
                    if (promise !== undefined) {
                        promise.catch(() => {
                            // если автоплей заблокирован — пробуем ещё раз с небольшой задержкой
                            setTimeout(() => {
                                clownAudio.play().catch(() => {});
                            }, 100);
                        });
                    }
                } catch (_) {
                    // игнорируем
                }
            }

            // ---- конфетти ----
            function fireConfetti() {
                if (isConfettiActive) return;
                isConfettiActive = true;

                const container = confettiContainer;
                const colors = ['#facc15', '#f87171', '#60a5fa', '#34d399', '#f472b6', '#c084fc', '#fb923c', '#22d3ee', '#ffd700', '#ff6b6b', '#48dbfb', '#ff9ff3'];
                const count = 55;

                for (let i = 0; i < count; i++) {
                    const piece = document.createElement('div');
                    piece.className = 'confetti-piece';
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    piece.style.backgroundColor = color;

                    const startX = window.innerWidth / 2 + (Math.random() - 0.5) * 120;
                    const startY = window.innerHeight / 2 + (Math.random() - 0.5) * 80;
                    piece.style.left = startX + 'px';
                    piece.style.top = startY + 'px';

                    const size = 8 + Math.random() * 14;
                    piece.style.width = size + 'px';
                    piece.style.height = size + 'px';
                    piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';

                    const angle = Math.random() * 2 * Math.PI;
                    const distance = 160 + Math.random() * 500;
                    const tx = Math.cos(angle) * distance;
                    const ty = Math.sin(angle) * distance - 160;

                    piece.style.setProperty('--tx', tx + 'px');
                    piece.style.setProperty('--ty', ty + 'px');

                    const duration = 1.8 + Math.random() * 1.4;
                    piece.style.animationDuration = duration + 's';
                    piece.style.animationDelay = (Math.random() * 0.4) + 's';

                    container.appendChild(piece);

                    setTimeout(() => {
                        if (piece.parentNode) piece.remove();
                    }, (duration + 0.8) * 1000);
                }

                setTimeout(() => {
                    isConfettiActive = false;
                }, 3000);
            }

            // ---- показать анекдот ----
            function showJoke() {
                if (!jokeShown) {
                    questionText.style.display = 'none';
                    btnGroup.style.display = 'none';
                    jokeShown = true;
                }

                // выбираем случайный анекдот
                let available = [];
                for (let i = 0; i < jokes.length; i++) {
                    if (!usedIndices.includes(i)) available.push(i);
                }

                if (available.length === 0) {
                    usedIndices = [];
                    available = jokes.map((_, i) => i);
                }

                const randomIdx = available[Math.floor(Math.random() * available.length)];
                usedIndices.push(randomIdx);

                jokeDisplay.innerHTML = jokes[randomIdx];
                jokeDisplay.classList.add('show');

                moreBtn.style.display = 'inline-block';
                jokeCounter++;

                // звук и конфетти
                playClownSound();
                fireConfetti();
                setTimeout(() => {
                    if (!isConfettiActive) fireConfetti();
                }, 400);

                // если показано 5 анекдотов и опрос ещё не показывали — показываем опрос
                if (jokeCounter >= 5 && !surveyShown) {
                    setTimeout(() => {
                        showSurvey();
                    }, 900);
                }
            }

            // ---- показать опрос (только 1 раз) ----
            function showSurvey() {
                if (surveyShown) return;
                surveyShown = true;

                moreBtn.style.display = 'none';
                jokeDisplay.classList.remove('show');
                jokeDisplay.style.display = 'none';

                surveyOverlay.style.display = 'block';
                surveyBtns.style.display = 'flex';
                surveyResult.style.display = 'none';

                fireConfetti();
                playClownSound();
            }

            // ---- обработчики ----
            yesBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                showJoke();
            });

            yesBtn.addEventListener('touchend', function(e) {
                e.preventDefault();
                showJoke();
            }, { passive: false });

            moreBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                showJoke();
            });

            moreBtn.addEventListener('touchend', function(e) {
                e.preventDefault();
                showJoke();
            }, { passive: false });

            // ---- УБЕГАЮЩАЯ КНОПКА "НЕТ" ----
            function moveNoButton() {
                if (jokeShown) return;

                const cardRect = mainCard.getBoundingClientRect();
                const btnWidth = noBtn.offsetWidth;
                const btnHeight = noBtn.offsetHeight;

                const padding = 14;
                const areaWidth = cardRect.width - padding * 2 - btnWidth;
                const areaHeight = cardRect.height - padding * 2 - btnHeight;

                if (areaWidth <= 0 || areaHeight <= 0) return;

                const currentLeft = noBtn.offsetLeft;
                const currentTop = noBtn.offsetTop;

                let newLeft, newTop;
                let attempts = 0;
                const maxAttempts = 40;

                do {
                    newLeft = Math.random() * areaWidth + padding;
                    newTop = Math.random() * areaHeight + padding;
                    attempts++;
                } while (
                    (Math.abs(newLeft - currentLeft) < 50 && Math.abs(newTop - currentTop) < 50) &&
                    attempts < maxAttempts
                );

                noBtn.style.left = newLeft + 'px';
                noBtn.style.top = newTop + 'px';
            }

            noBtn.addEventListener('mouseenter', function(e) {
                if (jokeShown) return;
                moveNoButton();
            });

            noBtn.addEventListener('touchstart', function(e) {
                if (jokeShown) return;
                e.preventDefault();
                moveNoButton();
            }, { passive: false });

            noBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                if (!jokeShown) {
                    moveNoButton();
                }
            });

            // ---- кнопки опроса ----
            surveyYes.addEventListener('click', function() {
                surveyBtns.style.display = 'none';
                surveyResult.style.display = 'block';
                surveyResult.innerHTML = '<span class="happy">😊 Правильный ответ! Молодец!</span>';
                fireConfetti();
                playClownSound();
                // продолжаем показывать анекдоты, но опрос больше не появится
                setTimeout(() => {
                    surveyOverlay.style.display = 'none';
                    jokeDisplay.style.display = 'block';
                    // сбрасываем счётчик, чтобы опрос не запустился снова
                    jokeCounter = 0;
                    showJoke();
                }, 1200);
            });

            surveyNo.addEventListener('click', function() {
                surveyBtns.style.display = 'none';
                surveyResult.style.display = 'block';
                surveyResult.innerHTML = '<span class="highlight">🤬 Ты че, ахуел(а)?</span>';
                fireConfetti();
                playClownSound();
                setTimeout(() => fireConfetti(), 500);
                // больше ничего не делаем — пользователь обиделся
            });

            // ---- сброс позиции при ресайзе ----
            window.addEventListener('resize', function() {
                if (!jokeShown) {
                    noBtn.style.left = 'auto';
                    noBtn.style.top = 'auto';
                }
            });

            window.addEventListener('orientationchange', function() {
                setTimeout(() => {
                    if (!jokeShown) {
                        noBtn.style.left = 'auto';
                        noBtn.style.top = 'auto';
                    }
                }, 300);
            });

        })();
